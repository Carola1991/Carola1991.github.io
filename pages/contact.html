  <main class="container-xl page">
    <h2 class="page-title">Send me a signal</h2>
    <p class="page-intro">Write me a message and I'll get back to you as soon as possible.</p>
    <div class="contact">
      <!-- Formspree for the form contact-->
      <form class="contact-form" action="https://formspree.io/f/meaabjeg" method="POST">
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" name="name" autocomplete="name" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control" id="message" name="message" rows="5" minlength="10" required></textarea>
        </div>
        <!-- spam trap: real people never see or fill it -->
        <input type="text" name="_gotcha" class="visually-hidden" tabindex="-1" autocomplete="off" aria-hidden="true">
        <input type="hidden" name="_subject" value="New message from the portfolio">
        <button type="submit" class="btn btn-star">Send message</button>
      </form>
      <aside class="socials" aria-label="Social media">
        <h3>Find me here too</h3>
        <div class="socials-list">
        <a href="https://www.linkedin.com/in/carola-d-orsi" target="_blank" rel="noopener"><i class="bi bi-linkedin"></i> LinkedIn</a>
        <a href="https://github.com/Carola1991/" target="_blank" rel="noopener"><i class="bi bi-github"></i> GitHub</a>
        </div>
      </aside>
    </div>
